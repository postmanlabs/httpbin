name: build test and publish

on:
  push:
    tags:
      - "**"
  pull_request:

permissions:
  contents: read
  pull-requests: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    outputs:
      httpbin: ${{ steps.push_images.outputs.httpbin }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6

      - name: AWS ECR Login
        id: ecr-login
        uses: verygood-ops/cicd-shared/.github/actions/aws-ecr-login@bac4eacd02fa06a45355a857f573029fc2198092  # aws-ecr-login-action-v1.0.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708  # v5.1.1
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::190066226418:role/CiAppBuilderRole

      - name: Infos
        id: infos
        run: |
          if [[ ${EXTRACT_SEMVER} == 'true' ]]; then
            VERSION=${TAG##*-v}  # remove everything up to and including -v
            VERSION=${VERSION#v} # remove initial v if it's just v1.2.3
          else
            VERSION=${TAG}
          fi
          
          echo "REGISTRY=$REGISTRY" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
        env:
          EXTRACT_SEMVER: ${{ github.ref_type == 'tag' }}
          REGISTRY: ${{ (github.ref_type == 'tag') && steps.ecr-login.outputs.release_registry || steps.ecr-login.outputs.ephemeral_registry }}
          TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || github.sha }}

      - name: Build image
        run: |
          make images_build

      - name: Test image
        run: |
          make images_test

      - name: Push image
        id: push_images
        run: |
          make images_push
          echo "httpbin=${REGISTRY}/vault/httpbin:${VERSION}" >> $GITHUB_OUTPUT

  orca:
    needs: ["build-images"]
    uses: verygood-ops/cicd-shared/.github/workflows/security-scan-container.yaml@security-scan-container-v2.1.0
    with:
      images: |
        [
          "${{ needs.build-images.outputs.httpbin }}"
        ]
    secrets:
      ORCA_SECURITY_API_TOKEN: ${{ secrets.ORCA_SECURITY_API_TOKEN }}