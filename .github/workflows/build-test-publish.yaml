#    needs: ["build-images"]
#    uses: verygood-ops/cicd-shared/.github/workflows/security-scan-container.yaml@security-scan-container-v2.1.0
#    with:
#      images: |
#        [
#          "${{ needs.build-images.outputs.vault-api }}",
#          "${{ needs.build-images.outputs.vault-api-smoke-tests }}",
#          "${{ needs.build-images.outputs.vault-api-healthcheck }}"
