[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "httpbin"
dynamic = ["version"]
description = "HTTP Request and Response Service"
requires-python = ">=3.11"
# httpbin is ISC (see LICENSE). The vendored Swagger UI is Apache-2.0, and its
# bundles include code under MIT, BSD-3-Clause and Apache-2.0 OR MPL-2.0.
license = "ISC AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR MPL-2.0)"
license-files = [
    "LICENSE",
    "httpbin/static/swagger-ui/LICENSE",
    "httpbin/static/swagger-ui/NOTICE",
    "httpbin/static/swagger-ui/*.LICENSE.txt",
]
authors = [{ name = "Kenneth Reitz", email = "me@kennethreitz.org" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
# The lowest versions that work; a CI job tests them. The exact versions
# that are deployed, with hashes, are in requirements.txt and
# requirements-test.txt.
dependencies = [
    "Brotli>=1.0.9",
    "decorator>=4.0",
    "flasgger>=0.9.7.1",
    "Flask>=3.0",
    "Werkzeug>=3.0",
]

[project.optional-dependencies]
server = [
    "gevent>=22.10.2",
    "gunicorn>=20.1.0",
]
test = [
    "requests>=2.32.2",
]
# /zstd needs zstd support: built into Python 3.14, a package before that
zstd = [
    "backports.zstd>=1.0; python_version < '3.14'",
]

[project.urls]
Repository = "https://github.com/postmanlabs/httpbin"

[tool.setuptools]
packages = ["httpbin"]

[tool.setuptools.dynamic]
version = { file = "httpbin/VERSION" }
